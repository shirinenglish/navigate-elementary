<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Navigate Elementary · Homework</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FB; --card:#fff; --ink:#1E2433; --muted:#6B7385; --line:#E3E8F0;
  --ok:#1F9D63; --okbg:#E6F6EE; --bad:#D9443B; --badbg:#FDECEA;
  --accent:#2F6FD6; --accentbg:#EAF1FC;
  --r:16px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 60px}
header.top{background:var(--accent);color:#fff;padding:18px 0 22px;margin-bottom:18px}
header.top .wrap{padding-bottom:0}
.top h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.2px}
.top p{margin:2px 0 0;opacity:.9;font-size:15px}
.back{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;font-size:14px;margin-bottom:10px}
.namebox{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.namebox label{font-weight:700;display:block;margin-bottom:6px}
.namebox input{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line);border-radius:12px}
.unitcard{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.06);border-left:8px solid var(--c)}
.unitcard .n{font-size:13px;font-weight:800;color:var(--c);text-transform:uppercase;letter-spacing:.8px}
.unitcard h2{margin:2px 0 4px;font-size:22px}
.unitcard .topics{color:var(--muted);font-size:15px}
.bar{height:8px;background:var(--line);border-radius:99px;margin-top:12px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px;transition:width .4s}
.barlabel{font-size:13px;color:var(--muted);margin-top:4px}
.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:6px;padding:10px 0}
.tab{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 2px;font-weight:800;font-size:14px;white-space:nowrap}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab small{font-weight:600;opacity:.8}
.card{background:var(--card);border-radius:var(--r);padding:18px;margin:14px 0;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.card h3{margin:0;font-size:19px}
.card .ru{color:var(--muted);font-style:italic;font-size:14px;margin:2px 0 12px}
.score{float:right;font-size:13px;font-weight:800;background:var(--accentbg);color:var(--accent);padding:3px 10px;border-radius:99px}
.score:empty{display:none}
.score.done{background:var(--okbg);color:var(--ok)}
.item{padding:12px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.q{margin-bottom:8px;font-weight:600}
.q .num{color:var(--accent);font-weight:800;margin-right:6px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 14px;font-weight:700;transition:transform .1s}
.opt:active{transform:scale(.97)}
.opt.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opt.bad{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:shake .3s}
.opt[disabled]{cursor:default}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.match{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.match .col{display:flex;flex-direction:column;gap:8px}
.mbtn{border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:700;min-height:48px}
.mbtn.sel{border-color:var(--accent);background:var(--accentbg)}
.mbtn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok);opacity:.7}
.mbtn.bad{background:var(--badbg);border-color:var(--bad);animation:shake .3s}
.typerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.typerow input{font:inherit;font-weight:700;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:180px}
.typerow input.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.typerow input.bad{border-color:var(--bad);background:var(--badbg)}
.small{font-size:14px;border:0;background:var(--accentbg);color:var(--accent);border-radius:10px;padding:8px 12px;font-weight:700}
.btn{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 18px;font-weight:800}
.btn.ghost{background:var(--accentbg);color:var(--accent)}
.fb{font-size:14px;font-weight:700;margin-top:6px}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700}
.chip.used{visibility:hidden}
.chip.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.chip.bad{background:var(--badbg);border-color:var(--bad);animation:shake .3s}
.answerline{min-height:52px;border:2px dashed var(--line);border-radius:12px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.answerline .chip{padding:6px 10px}
.orderlist{counter-reset:o;margin:0 0 10px;padding:0;list-style:none}
.orderlist li{counter-increment:o;background:var(--okbg);color:var(--ok);font-weight:700;border-radius:10px;padding:8px 12px;margin-bottom:6px}
.orderlist li::before{content:counter(o)". "}
.caps{line-height:2.4}
.cw{display:inline-block;border:0;background:none;padding:2px 1px;border-radius:8px;font-weight:600;font-size:18px}
.cw.sel{background:var(--accentbg);color:var(--accent);text-decoration:underline}
.cw.ok{background:var(--okbg);color:var(--ok)}
.cw.miss{background:#FFF4D6;color:#A36A00}
.cw.bad{background:var(--badbg);color:var(--bad)}
.flash{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fc{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;min-height:88px;font-weight:800;font-size:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fc .back2{display:none;font-weight:600;color:var(--accent);font-size:15px}
.fc.flip{background:var(--accentbg);border-color:var(--accent)}
.fc.flip .front{font-size:13px;color:var(--muted)}
.fc.flip .back2{display:block}
.text{font-size:18px;line-height:1.7}
.text h4{margin:0 0 6px;font-size:20px}
.text p{margin:0 0 12px}
.gl{border:0;background:none;padding:0;font:inherit;color:inherit;border-bottom:2px dotted var(--accent);cursor:help}
.tip{display:inline-block;background:var(--ink);color:#fff;font-size:13px;font-weight:700;border-radius:8px;padding:1px 8px;margin:0 4px;vertical-align:middle}
.model{background:#FBFAF4;border-left:5px solid var(--accent);border-radius:10px;padding:12px 14px;white-space:pre-line;font-size:17px}
.model b{color:var(--accent)}
details summary{cursor:pointer;font-weight:800;color:var(--accent);margin:8px 0}
textarea{width:100%;min-height:200px;font:inherit;font-size:17px;padding:12px;border:2px solid var(--line);border-radius:12px;resize:vertical}
.checks{list-style:none;padding:0;margin:10px 0}
.checks li{padding:4px 0;font-weight:600;color:var(--muted)}
.checks li::before{content:"○ ";font-weight:800}
.checks li.on{color:var(--ok)}
.checks li.on::before{content:"✓ "}
.wc{font-weight:800}
.tip-box{background:var(--accentbg);border-radius:12px;padding:10px 14px;font-size:15px;margin:8px 0}
.svgclock{display:block;margin:4px 0 10px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
.pages{font-size:13px;color:var(--muted)}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

const KEY="navElemHW_v1";
let store={name:"",scores:{},drafts:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)); if(s) store=Object.assign(store,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
function setScore(id,got,total){store.scores[id]={got,total}; save(); updateScore(id);}

const SECTIONS=[["vocab","Vocabulary"],["reading","Reading"],["grammar","Grammar"],["writing","Writing"]];

/* =========================================================
   HELPERS
   ========================================================= */
const $=s=>document.querySelector(s);
function el(tag,attrs={},html=""){const e=document.createElement(tag);for(const k in attrs){if(k==="class")e.className=attrs[k];else if(k.startsWith("on"))e[k]=attrs[k];else e.setAttribute(k,attrs[k]);}if(html)e.innerHTML=html;return e;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(t){const x=$("#toast");x.textContent=t;x.classList.add("show");clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove("show"),1600);}
function norm(s){return s.toLowerCase().replace(/[’']/g,"'").replace(/\s+/g," ").trim();}
function allExercises(u){
  const list=[...u.vocab,...u.reading.ex,...u.grammar,...u.writing.steps];
  return list.filter(e=>e.type!=="flash");
}
function unitProgress(u){
  const ex=allExercises(u); let done=0,got=0,tot=0;
  ex.forEach(e=>{const s=store.scores[e.id]; if(s){done++;got+=s.got;tot+=s.total;}});
  const w=store.drafts[u.id]&&store.drafts[u.id].sent?1:0;
  return {done:done+w,all:ex.length+1,pct:Math.round((done+w)/(ex.length+1)*100),got,tot};
}

function cardShell(ex,count){
  const c=el("div",{class:"card",id:"card-"+ex.id});
  const h=el("h3",{},ex.title);
  if(count){const sc=el("span",{class:"score",id:"score-"+ex.id});h.prepend(sc);}
  c.append(h);
  if(ex.ru)c.append(el("div",{class:"ru"},ex.ru));
  if(ex.tip)c.append(el("div",{class:"tip-box"},ex.tip));
  return c;
}
function updateScore(id){
  const s=store.scores[id], b=document.getElementById("score-"+id);
  if(!b)return;
  if(s){b.textContent=s.got+" / "+s.total;b.classList.add("done");}else{b.textContent="";b.classList.remove("done");}
}
function finishMsg(got,total){
  const p=got/total;
  return p===1?"Excellent! 🌟":p>=.8?"Very good! 👍":p>=.5?"Good. Try again for a better score.":"Keep practising – try again!";
}
function resetBtn(ex,container,renderFn){
  return el("button",{class:"small",onclick:()=>{delete store.scores[ex.id];save();const n=renderFn(ex);container.replaceWith(n);updateScore(ex.id);}},"↺ Try again");
}

/* =========================================================
   CLOCK
   ========================================================= */
function clockSVG(h,m){
  const cx=60,cy=60;
  const ma=(m/60)*2*Math.PI, ha=((h%12)+m/60)/12*2*Math.PI;
  const hand=(a,len,w,c)=>`<line x1="${cx}" y1="${cy}" x2="${cx+len*Math.sin(a)}" y2="${cy-len*Math.cos(a)}" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  let ticks="";
  for(let i=1;i<=12;i++){const a=i/12*2*Math.PI;ticks+=`<text x="${cx+43*Math.sin(a)}" y="${cy-43*Math.cos(a)+5}" font-size="13" font-weight="700" text-anchor="middle" fill="#1E2433">${i}</text>`;}
  return `<svg class="svgclock" width="120" height="120" viewBox="0 0 120 120" role="img" aria-label="clock"><circle cx="60" cy="60" r="56" fill="#fff" stroke="var(--accent)" stroke-width="4"/>${ticks}${hand(ha,26,6,"#1E2433")}${hand(ma,40,3.5,"var(--accent)")}<circle cx="60" cy="60" r="4" fill="#1E2433"/></svg>`;
}

   ========================================================= */
function renderFlash(ex){
  const c=cardShell(ex,false), g=el("div",{class:"flash"});
  ex.words.forEach(([en,ru])=>{
    const b=el("button",{class:"fc"},`<span class="front">${en}</span><span class="back2">${ru}</span>`);
    b.onclick=()=>b.classList.toggle("flip");
    g.append(b);
  });
  c.append(g);return c;
}

function renderChoice(ex){
  const c=cardShell(ex,true); let firstTry=0,answered=0; const n=ex.items.length;
  ex.items.forEach((it,i)=>{
    const row=el("div",{class:"item"});
    if(it.clock)row.innerHTML=clockSVG(it.clock[0],it.clock[1]);
    row.append(el("div",{class:"q"},`<span class="num">${i+1}</span>${it.q.replace("___","<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}`));
    const opts=el("div",{class:"opts"}); let wrong=false;
    const order=ex.tf?it.o.slice().sort((a,b)=>a==="True"||a==="Formal"?-1:1):shuffle(it.o);
    order.forEach(o=>{
      const b=el("button",{class:"opt"},o);
      b.onclick=()=>{
        if(o===it.o[0]){
          b.classList.add("ok"); opts.querySelectorAll("button").forEach(x=>x.disabled=true);
          if(!wrong)firstTry++; answered++;
          if(answered===n){setScore(ex.id,firstTry,n);c.append(el("div",{class:"fb ok"},finishMsg(firstTry,n)),resetBtn(ex,c,renderChoice));}
        }else{wrong=true;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");}
      };
      opts.append(b);
    });
    row.append(opts);c.append(row);
  });
  setTimeout(()=>updateScore(ex.id));
  return c;
}

function renderMatch(ex){
  const c=cardShell(ex,true); let round=0,mistakes=0;
  const total=ex.rounds.reduce((a,r)=>a+r.length,0);
  const box=el("div"); c.append(box);
  function draw(){
    box.innerHTML="";
    const pairs=ex.rounds[round]; let left=null,leftBtn=null,matched=0;
    box.append(el("div",{class:"pages"},`Round ${round+1} of ${ex.rounds.length}`));
    const grid=el("div",{class:"match"}),L=el("div",{class:"col"}),R=el("div",{class:"col"});
    shuffle(pairs).forEach(p=>{const b=el("button",{class:"mbtn"},p[0]);b.onclick=()=>{if(b.classList.contains("ok"))return;L.querySelectorAll(".sel").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");left=p;leftBtn=b;};L.append(b);});
    shuffle(pairs).forEach(p=>{const b=el("button",{class:"mbtn"},p[1]);b.onclick=()=>{
      if(b.classList.contains("ok"))return;
      if(!left){toast("First tap a word on the left");return;}
      if(left[1]===p[1]){b.classList.add("ok");leftBtn.classList.remove("sel");leftBtn.classList.add("ok");left=null;matched++;
        if(matched===pairs.length){round++; if(round<ex.rounds.length)setTimeout(draw,500); else {const got=Math.max(0,total-mistakes);setScore(ex.id,got,total);box.append(el("div",{class:"fb ok"},finishMsg(got,total)),resetBtn(ex,c,renderMatch));}}
      }else{mistakes++;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");}
    };R.append(b);});
    grid.append(L,R);box.append(grid);
  }
  draw(); setTimeout(()=>updateScore(ex.id)); return c;
}

function renderType(ex){
  const c=cardShell(ex,true); let firstTry=0,answered=0; const n=ex.items.length;
  ex.items.forEach((it,i)=>{
    const row=el("div",{class:"item"});
    row.append(el("div",{class:"q"},`<span class="num">${i+1}</span>${it.q}`));
    const tr=el("div",{class:"typerow"}), inp=el("input",{type:"text",autocapitalize:"off",autocomplete:"off",spellcheck:"false"});
    const chk=el("button",{class:"small"},"Check"), hint=el("button",{class:"small"},"Hint"), fb=el("div",{class:"fb"});
    let wrong=false,done=false;
    const check=()=>{
      if(done)return; const v=norm(inp.value); if(!v)return;
      if(it.a.map(norm).includes(v)){done=true;inp.className="ok";inp.disabled=true;chk.remove();hint.remove();fb.className="fb ok";fb.textContent="✓ Correct!";if(!wrong)firstTry++;answered++;
        if(answered===n){setScore(ex.id,firstTry,n);c.append(el("div",{class:"fb ok"},finishMsg(firstTry,n)),resetBtn(ex,c,renderType));}}
      else{wrong=true;inp.className="bad";fb.className="fb bad";fb.textContent="Not quite – try again or tap Hint.";}
    };
    chk.onclick=check; inp.onkeydown=e=>{if(e.key==="Enter")check();};
    hint.onclick=()=>{wrong=true;const a=it.a[0];fb.className="fb";fb.textContent="Starts with: "+a.slice(0,Math.ceil(a.length/2))+"…";};
    tr.append(inp,chk,hint);row.append(tr,fb);c.append(row);
  });
  setTimeout(()=>updateScore(ex.id)); return c;
}

function renderOrder(ex){
  const c=cardShell(ex,true); let next=0,mistakes=0; const n=ex.items.length;
  const list=el("ol",{class:"orderlist"}), chips=el("div",{class:"chips"});
  c.append(el("div",{class:"pages"},"Tap the first one, then the next …"),list,chips);

      else{mistakes++;b.classList.remove("bad");void b.offsetWidth;b.classList.add("bad");}
    };
    chips.append(b);
  });
  setTimeout(()=>updateScore(ex.id)); return c;
}

function renderBuild(ex){
  const c=cardShell(ex,true); let firstTry=0,answered=0; const n=ex.items.length;
  ex.items.forEach((it,i)=>{
    const row=el("div",{class:"item"}), line=el("div",{class:"answerline"}), chips=el("div",{class:"chips"}), fb=el("div",{class:"fb"});
    row.append(el("div",{class:"q"},`<span class="num">${i+1}</span>`));
    let picked=[],wrong=false,done=false;
    const chk=el("button",{class:"small"},"Check");
    let words=shuffle(it.w); if(words.join()===it.w.join())words=words.slice(1).concat(words[0]);
    words.forEach(w=>{
      const b=el("button",{class:"chip"},w);
      b.onclick=()=>{ if(done)return; b.classList.add("used"); picked.push(w);
        const p=el("button",{class:"chip"},w); p.onclick=()=>{if(done)return;picked.splice(picked.indexOf(w),1);p.remove();b.classList.remove("used");}; line.append(p);};
      chips.append(b);
    });
    chk.onclick=()=>{
      if(done)return;
      if(picked.length<it.w.length){fb.className="fb bad";fb.textContent="Use all the words.";return;}
      if(picked.join(" ")===it.w.join(" ")){done=true;line.querySelectorAll(".chip").forEach(x=>x.classList.add("ok"));line.append(el("b",{},it.end));chk.remove();fb.className="fb ok";fb.textContent="✓ Correct!";if(!wrong)firstTry++;answered++;
        if(answered===n){setScore(ex.id,firstTry,n);c.append(el("div",{class:"fb ok"},finishMsg(firstTry,n)),resetBtn(ex,c,renderBuild));}}
      else{wrong=true;fb.className="fb bad";fb.textContent="Check the word order. Tap a word in the line to move it back.";}
    };
    row.append(line,chips,el("div",{style:"margin-top:8px"}),fb);row.lastChild.before(chk);c.append(row);
  });
  setTimeout(()=>updateScore(ex.id)); return c;
}

function renderCaps(ex){
  const c=cardShell(ex,true); const box=el("div",{class:"caps"}); const toks=[];
  ex.text.split(" ").forEach(raw=>{
    const need=raw.startsWith("*"); const w=need?raw.slice(1):raw;
    const m=w.match(/^([A-Za-z']+)(.*)$/); const core=m?m[1]:w, tail=m?m[2]:"";
    const b=el("button",{class:"cw"},core); const t={b,need,core,sel:false};
    b.onclick=()=>{if(c._done)return;t.sel=!t.sel;b.classList.toggle("sel");b.textContent=t.sel?core[0].toUpperCase()+core.slice(1):core;};
    toks.push(t); box.append(b); if(tail)box.append(document.createTextNode(tail)); box.append(document.createTextNode(" "));
  });
  const fb=el("div",{class:"fb"}), chk=el("button",{class:"btn"},"Check"); let first=null;
  chk.onclick=()=>{
    const needN=toks.filter(t=>t.need).length; let right=0,extra=0;
    toks.forEach(t=>{t.b.classList.remove("ok","miss","bad");
      if(t.need&&t.sel){t.b.classList.add("ok");right++;}
      else if(t.need&&!t.sel){t.b.classList.add("miss");}
      else if(!t.need&&t.sel){t.b.classList.add("bad");extra++;}});
    const got=Math.max(0,right-extra); if(first===null)first=got;
    if(right===needN&&!extra){fb.className="fb ok";fb.textContent="✓ Perfect! All "+needN+" capital letters are correct.";c._done=true;chk.remove();setScore(ex.id,first,needN);c.append(el("div",{class:"fb ok"},finishMsg(first,needN)),resetBtn(ex,c,renderCaps));}
    else{fb.className="fb bad";fb.textContent=`You found ${right} of ${needN}. Yellow = missing, red = no capital here. Fix them and check again.`;}
  };
  c.append(box,el("div",{style:"height:10px"}),chk,fb);
  setTimeout(()=>updateScore(ex.id)); return c;
}

const RENDER={flash:renderFlash,choice:renderChoice,match:renderMatch,type:renderType,order:renderOrder,build:renderBuild,caps:renderCaps};

/* =========================================================
   READING & WRITING
   ========================================================= */
function renderReadingText(r){
  const c=el("div",{class:"card text"});
  c.append(el("h3",{style:"font-size:22px;margin-bottom:4px"},r.title));
  c.append(el("div",{class:"ru",style:"margin-bottom:14px"},"Прочитайте текст. Нажмите на подчёркнутые слова, чтобы увидеть перевод."));
  r.paras.forEach(p=>{
    const html=p.replace(/\{([^|}]+)\|([^}]+)\}/g,(m,w,ru)=>`<button class="gl" data-ru="${ru}">${w}</button>`);
    const para=el("p",{},html); c.append(para);
  });
  c.querySelectorAll(".gl").forEach(b=>b.onclick=()=>{
    const nx=b.nextSibling; if(nx&&nx.classList&&nx.classList.contains("tip")){nx.remove();return;}
    b.after(el("span",{class:"tip"},b.dataset.ru));
  });
  return c;
}

const CHECKS={
  count:(t,w)=>({label:`${w.min}–${w.max} words`,ok:wc(t)>=w.min&&wc(t)<=w.max}),
  capsI:t=>({label:"'I' is always a capital letter",ok:t.trim().length>0&&!/(^|[^A-Za-z'])i([^A-Za-z]|$)/.test(t)}),
  capsStart:t=>({label:"Every sentence starts with a capital letter",ok:t.trim().length>0&&!/(^\s*[a-z])|([.!?]\s+[a-z])/.test(t)}),
  and:t=>({label:"uses and",ok:/\band\b/i.test(t)}),
  but:t=>({label:"uses but",ok:/\bbut\b/i.test(t)}),
  or:t=>({label:"uses or",ok:/\bor\b/i.test(t)}),
  because:t=>({label:"uses because",ok:/\bbecause\b/i.test(t)}),
  opening:t=>({label:"has an opening (Dear … / Hi … / Hello …)",ok:/^\s*(dear|hi|hello)\b/i.test(t)}),
  closing:t=>({label:"has a closing (Yours sincerely / Best wishes / Regards / All the best / Love)",ok:/(yours sincerely|yours faithfully|best wishes|regards|all the best|love,|see you)/i.test(t)}),
  question:t=>({label:"has a question or a request (?)",ok:/\?/.test(t)})
};
function wc(t){const m=t.trim().match(/[A-Za-zА-Яа-яЁё0-9'’-]+/g);return m?m.length:0;}

function renderWriting(u){
  const w=u.writing, frag=document.createDocumentFragment();
  w.steps.forEach(s=>frag.append(RENDER[s.type](s)));
  const c=el("div",{class:"card"});
  c.append(el("h3",{},`Step ${w.steps.length+1} · Read the model`));
  c.append(el("div",{class:"ru"},"Прочитайте пример."));
  c.append(el("div",{class:"model"},w.model));
  frag.append(c);

  const t=el("div",{class:"card"});
  t.append(el("h3",{},`Step ${w.steps.length+2} · Your turn ✍️`));
  t.append(el("div",{class:"ru"},w.taskru));
  t.append(el("p",{style:"white-space:pre-line;font-weight:700;margin:0 0 8px"},w.task));
  t.append(el("div",{class:"tip-box"},"<b>Include:</b> "+w.include.join(" · ")));
  const ta=el("textarea",{placeholder:"Write here…"});
  const d=store.drafts[u.id]; if(d)ta.value=d.text||"";
  const info=el("div",{style:"margin-top:6px"});
  const checks=el("ul",{class:"checks"});
  const upd=()=>{
    const n=wc(ta.value);
    info.innerHTML=`<span class="wc">${n}</span> words <span class="pages">(target ${w.min}–${w.max})</span>`;
    checks.innerHTML="";
    w.checks.forEach(k=>{const r=CHECKS[k](ta.value,w);checks.append(el("li",{class:r.ok?"on":""},r.label));});
    store.drafts[u.id]=Object.assign(store.drafts[u.id]||{}, {text:ta.value}); save();
  };
  ta.oninput=upd;
  const copy=el("button",{class:"btn"},"📋 Copy and send to my teacher");
  copy.onclick=()=>{
    if(wc(ta.value)<10){toast("Write your text first");return;}
    const ex=allExercises(u).map(e=>{const s=store.scores[e.id];return s?`${e.title}: ${s.got}/${s.total}`:null;}).filter(Boolean);
    const msg=`Navigate Elementary – Unit ${u.n} homework\nName: ${store.name||"—"}\n\nWriting: ${w.title}\n${ta.value.trim()}\n\n(${wc(ta.value)} words)\n\nScores:\n${ex.join("\n")||"—"}`;
    const done=()=>{store.drafts[u.id].sent=true;save();toast("Copied! Paste it in Telegram to your teacher.");};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(msg).then(done,()=>fallbackCopy(msg,done));}else fallbackCopy(msg,done);
  };
  t.append(ta,info,checks,copy);
  t.append(el("div",{class:"pages",style:"margin-top:8px"},"Your text is saved on this device. The button copies your text and your scores – then paste them in a message to your teacher."));
  frag.append(t); setTimeout(upd);
  return frag;
}
function fallbackCopy(txt,cb){const a=el("textarea");a.value=txt;document.body.append(a);a.select();try{document.execCommand("copy");cb();}catch(e){toast("Please select and copy the text");}a.remove();}

/* =========================================================
   PAGES
   ========================================================= */
function setAccent(col){document.documentElement.style.setProperty("--accent",col);document.documentElement.style.setProperty("--accentbg",col+"1A");}

function home(){
  setAccent("#2F6FD6"); view.unit=null;
  const app=$("#app"); app.innerHTML="";
  const h=el("header",{class:"top"}); const hw=el("div",{class:"wrap"});
  hw.append(el("h1",{},"Navigate Elementary · Homework"),el("p",{},"A2 · Vocabulary, reading, grammar and writing"));
  h.append(hw); app.append(h);
  const w=el("div",{class:"wrap"});
  const nb=el("div",{class:"namebox"}); nb.append(el("label",{for:"nm"},"Your name / Ваше имя"));
  const inp=el("input",{id:"nm",placeholder:"Write your name"}); inp.value=store.name; inp.oninput=()=>{store.name=inp.value;save();};
  nb.append(inp); w.append(nb);
  UNITS.forEach(u=>{
    const p=unitProgress(u);
    const b=el("button",{class:"unitcard",style:`--c:${u.color}`});
    b.innerHTML=`<div class="n">Unit ${u.n}</div><h2>${u.title}</h2><div class="topics">${u.topics}</div><div class="bar"><i style="width:${p.pct}%"></i></div><div class="barlabel">${p.done} of ${p.all} tasks done</div>`;
    b.onclick=()=>{location.hash=u.id+"/vocab";};
    w.append(b);
  });
  w.append(el("footer",{},"Homework based on Navigate Elementary A2 (Oxford) · Teacher: Shirin Ishbekova"));
  app.append(w); window.scrollTo(0,0);
}

function unitPage(u,tab){
  setAccent(u.color); view={unit:u,tab};
  const app=$("#app"); app.innerHTML="";
  const h=el("header",{class:"top"}); const hw=el("div",{class:"wrap"});
  const back=el("button",{class:"back"},"← All units"); back.onclick=()=>{location.hash="";};
  hw.append(back,el("h1",{},`Unit ${u.n} · ${u.title}`),el("p",{},u.pages));
  h.append(hw); app.append(h);
  const w=el("div",{class:"wrap"});
  const tabs=el("div",{class:"tabs"});
  SECTIONS.forEach(([k,label],i)=>{
    const b=el("button",{class:"tab"+(k===tab?" on":"")},label);
    b.onclick=()=>{location.hash=u.id+"/"+k;};
    tabs.append(b);
  });
  w.append(tabs);
  const body=el("div");
  if(tab==="vocab") u.vocab.forEach(ex=>body.append(RENDER[ex.type](ex)));
  if(tab==="reading"){body.append(renderReadingText(u.reading)); u.reading.ex.forEach(ex=>body.append(RENDER[ex.type](ex)));}
  if(tab==="grammar") u.grammar.forEach(ex=>body.append(RENDER[ex.type](ex)));
  if(tab==="writing"){body.append(el("h2",{style:"margin:10px 0 0"},u.writing.title)); body.append(renderWriting(u));}
  w.append(body);
  const idx=SECTIONS.findIndex(s=>s[0]===tab);
  if(idx<SECTIONS.length-1){const nx=el("button",{class:"btn",style:"width:100%;margin-top:6px"},`Next: ${SECTIONS[idx+1][1]} →`);nx.onclick=()=>{location.hash=u.id+"/"+SECTIONS[idx+1][0];};w.append(nx);}
  else {const nx=el("button",{class:"btn ghost",style:"width:100%;margin-top:6px"},"← Back to all units");nx.onclick=()=>{location.hash="";};w.append(nx);}
  w.append(el("footer",{},"Homework based on Navigate Elementary A2 (Oxford) · Teacher: Shirin Ishbekova"));
  app.append(w); window.scrollTo(0,0);
}

function route(){
  const [uid,tab]=location.hash.slice(1).split("/");
  const u=UNITS.find(x=>x.id===uid);
  if(u) unitPage(u,SECTIONS.some(s=>s[0]===tab)?tab:"vocab"); else home();
}
window.addEventListener("hashchange",route);
route();
</script>
